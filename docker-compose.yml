services:
  golfapp:
    build: .
    container_name: golfapp
    ports:
      - "8000:8000"
    environment:
      # Sollen Final-Four-Runden standardmäßig zur Jahreswertung zählen? (je Saison im Dashboard änderbar)
      FINAL_FOUR_IN_ANNUAL: "false"
      # Optional: Scorekarte per Foto auslesen (Claude). Schlüssel in .env setzen.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Auf "true" setzen, sobald die App nur noch per HTTPS erreichbar ist
      SESSION_COOKIE_SECURE: "false"
      # SECRET_KEY wird automatisch erzeugt und in /data/secret_key gespeichert.
    volumes:
      - golf-data:/data
    restart: unless-stopped

volumes:
  golf-data:
